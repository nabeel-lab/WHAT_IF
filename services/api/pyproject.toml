[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nabeel", email = "mhnu.6180@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.54",
    "supabase>=2.31.0",
    "uvicorn>=0.53.0",
    "httpx>=0.27.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "iniconfig>=2.3.0",
    "pytest>=9.1.1",
]
